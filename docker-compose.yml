version: "3.8"

services:
  # =====================
  # PostgreSQL Database
  # =====================
  db:
    image: postgres:16-alpine
    container_name: ganttflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ganttflow
      POSTGRES_USER: ${DB_USER:-ganttflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ganttflow} -d ganttflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ganttflow-network

  # =====================
  # Next.js Application
  # =====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    container_name: ganttflow-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-ganttflow}:${DB_PASSWORD}@db:5432/ganttflow
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?NextAuth secret is required}
      - NEXTAUTH_URL=${NEXT_PUBLIC_APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRO_PRICE_ID=${STRIPE_PRO_PRICE_ID:-}
      - STRIPE_BUSINESS_PRICE_ID=${STRIPE_BUSINESS_PRICE_ID:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - NODE_ENV=production
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ganttflow-network

volumes:
  postgres_data:
    driver: local

networks:
  ganttflow-network:
    driver: bridge
